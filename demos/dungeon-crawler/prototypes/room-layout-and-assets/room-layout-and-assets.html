<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Room — Layout &amp; Assets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f2818}
canvas{display:block;image-rendering:pixelated;position:absolute;top:0;left:0}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
const RW = 15;
const RH = 11;

const TILE = { WALL: 0, FLOOR: 1, DOOR_N: 2, DOOR_S: 3, DOOR_E: 4, DOOR_W: 5 };

function generateRoomTiles() {
  const tiles = [];
  for (let y = 0; y < RH; y++) {
    tiles[y] = [];
    for (let x = 0; x < RW; x++) {
      tiles[y][x] = TILE.FLOOR;
    }
  }
  for (let x = 0; x < RW; x++) {
    tiles[0][x] = TILE.WALL;
    tiles[RH - 1][x] = TILE.WALL;
  }
  for (let y = 0; y < RH; y++) {
    tiles[y][0] = TILE.WALL;
    tiles[y][RW - 1] = TILE.WALL;
  }
  tiles[0][7] = TILE.DOOR_N;
  tiles[RH - 1][7] = TILE.DOOR_S;
  tiles[5][0] = TILE.DOOR_W;
  tiles[5][RW - 1] = TILE.DOOR_E;
  return tiles;
}

const gc = document.getElementById('gc');
const gcx = gc.getContext('2d');

let W, H, tileSize, offsetX, offsetY;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  gc.width = W;
  gc.height = H;
  tileSize = Math.min(Math.floor(W / RW), Math.floor(H / RH));
  offsetX = Math.floor((W - RW * tileSize) / 2);
  offsetY = Math.floor((H - RH * tileSize) / 2);
}

const PALETTE = {
  bg:        '#0f2818',
  wallBase:  '#2d4d38',
  wallHi:    '#4a7a58',
  wallLo:    '#1a3a2a',
  wallDark:  '#1a2e22',
  wallBrick: '#3a5a44',
  floorA:    '#3a6a48',
  floorB:    '#2a4a38',
  floorLine: 'rgba(0,0,0,0.12)',
  tunnelBg:  '#0a1a10',
};

// === ASSET COLORS ===
const EC = {
  normal:   '#889096',
  champion: '#d4883a',
  elite:    '#c83838',
  boss:     '#7a388a',
};
const SYM = '#f0e8d8';
function $(v){return Math.round(v)}
function lighten(hex,a){
  return `rgb(${Math.min(255,parseInt(hex.slice(1,3),16)+a)},${Math.min(255,parseInt(hex.slice(3,5),16)+a)},${Math.min(255,parseInt(hex.slice(5,7),16)+a)})`;
}
function darken(hex,a){
  return `rgb(${Math.max(0,parseInt(hex.slice(1,3),16)-a)},${Math.max(0,parseInt(hex.slice(3,5),16)-a)},${Math.max(0,parseInt(hex.slice(5,7),16)-a)})`;
}
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawWallTile(px, py, ts) {
  gcx.fillStyle = PALETTE.wallBase;
  gcx.fillRect(px, py, ts, ts);
  gcx.fillStyle = PALETTE.wallHi;
  gcx.fillRect(px, py, ts, 2);
  gcx.fillRect(px, py, 2, ts);
  gcx.fillStyle = PALETTE.wallLo;
  gcx.fillRect(px + ts - 2, py, 2, ts);
  gcx.fillRect(px, py + ts - 2, ts, 2);
  const row = Math.floor((py - offsetY) / ts);
  if (row % 2 === 0) {
    gcx.fillStyle = PALETTE.wallBrick;
    gcx.fillRect(px + 2, py + 3, ts - 8, 1);
  } else {
    gcx.fillStyle = PALETTE.wallBrick;
    gcx.fillRect(px + 6, py + 3, ts - 10, 1);
  }
  const col = Math.floor((px - offsetX) / ts);
  if (col % 3 === 1) {
    gcx.fillStyle = PALETTE.wallDark;
    gcx.fillRect(px + 5, py + 2, 1, ts - 4);
  }
}

function drawArchway(px, py, ts, dir) {
  drawWallTile(px, py, ts);

  const pad = Math.max(2, Math.floor(ts * 0.04));
  const cx = px + ts * 0.5;
  const cy = py + ts * 0.5;
  const split = 0.35;

  gcx.fillStyle = PALETTE.tunnelBg;
  gcx.beginPath();

  if (dir === 'N') {
    const s = py + ts * split;
    gcx.moveTo(px + pad, py + ts - pad);
    gcx.lineTo(px + pad, s);
    gcx.quadraticCurveTo(px + pad, py + pad, cx, py + pad);
    gcx.quadraticCurveTo(px + ts - pad, py + pad, px + ts - pad, s);
    gcx.lineTo(px + ts - pad, py + ts - pad);
  } else if (dir === 'S') {
    const s = py + ts * (1 - split);
    gcx.moveTo(px + pad, py + pad);
    gcx.lineTo(px + pad, s);
    gcx.quadraticCurveTo(px + pad, py + ts - pad, cx, py + ts - pad);
    gcx.quadraticCurveTo(px + ts - pad, py + ts - pad, px + ts - pad, s);
    gcx.lineTo(px + ts - pad, py + pad);
  } else if (dir === 'W') {
    const s = px + ts * split;
    gcx.moveTo(px + ts - pad, py + pad);
    gcx.lineTo(s, py + pad);
    gcx.quadraticCurveTo(px + pad, py + pad, px + pad, cy);
    gcx.quadraticCurveTo(px + pad, py + ts - pad, s, py + ts - pad);
    gcx.lineTo(px + ts - pad, py + ts - pad);
  } else if (dir === 'E') {
    const s = px + ts * (1 - split);
    gcx.moveTo(px + pad, py + pad);
    gcx.lineTo(s, py + pad);
    gcx.quadraticCurveTo(px + ts - pad, py + pad, px + ts - pad, cy);
    gcx.quadraticCurveTo(px + ts - pad, py + ts - pad, s, py + ts - pad);
    gcx.lineTo(px + pad, py + ts - pad);
  }

  gcx.closePath();
  gcx.fill();
}

function drawRoom(tiles) {
  gcx.fillStyle = PALETTE.bg;
  gcx.fillRect(0, 0, W, H);

  const ts = tileSize;
  const ox = offsetX;
  const oy = offsetY;

  for (let y = 0; y < RH; y++) {
    for (let x = 0; x < RW; x++) {
      const px = ox + x * ts;
      const py = oy + y * ts;
      const t = tiles[y][x];

      switch (t) {
        case TILE.WALL:
          drawWallTile(px, py, ts);
          break;
        case TILE.FLOOR: {
          const isLight = (x + y) % 2 === 0;
          gcx.fillStyle = isLight ? PALETTE.floorA : PALETTE.floorB;
          gcx.fillRect(px, py, ts, ts);
          gcx.fillStyle = PALETTE.floorLine;
          gcx.fillRect(px, py, ts, 1);
          gcx.fillRect(px, py, 1, ts);
          break;
        }
        case TILE.DOOR_N: drawArchway(px, py, ts, 'N'); break;
        case TILE.DOOR_S: drawArchway(px, py, ts, 'S'); break;
        case TILE.DOOR_W: drawArchway(px, py, ts, 'W'); break;
        case TILE.DOOR_E: drawArchway(px, py, ts, 'E'); break;
      }
    }
  }

  const grad = gcx.createRadialGradient(
    W / 2, H / 2, Math.min(W, H) * 0.35,
    W / 2, H / 2, Math.max(W, H) * 0.65
  );
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  gcx.fillStyle = grad;
  gcx.fillRect(0, 0, W, H);

  gcx.strokeStyle = 'rgba(255,255,255,0.04)';
  gcx.lineWidth = 0.5;
  for (let y = 0; y <= RH; y++) {
    const ly = oy + y * ts;
    gcx.beginPath();
    gcx.moveTo(ox, ly);
    gcx.lineTo(ox + RW * ts, ly);
    gcx.stroke();
  }
  for (let x = 0; x <= RW; x++) {
    const lx = ox + x * ts;
    gcx.beginPath();
    gcx.moveTo(lx, oy);
    gcx.lineTo(lx, oy + RH * ts);
    gcx.stroke();
  }
}

// === ASSET DRAWING FUNCTIONS (symbols with margin) ===

function drawPlayer(px,py,ts){
  const cx=$(px+ts/2),cy=$(py+ts/2);
  const margin=$(ts*0.16);
  const r=$(ts*0.5-margin);
  const grad=gcx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'#e8dfd0');grad.addColorStop(1,'#d0c8b8');
  gcx.fillStyle=grad;
  gcx.beginPath();gcx.arc(cx,cy,r,0,Math.PI*2);gcx.fill();
  gcx.strokeStyle='#b0a898';gcx.lineWidth=Math.max(1,$(ts*0.025));
  gcx.beginPath();gcx.arc(cx,cy,r,0,Math.PI*2);gcx.stroke();
}

function drawChest(px,py,ts){
  const cx=$(px+ts/2),cy=$(py+ts/2);
  const margin=$(ts*0.16),rr=$(ts*0.06);
  const w=$(ts-margin*2),h=$(ts-margin*2);
  const x=$(px+margin),y=$(py+margin);
  const grad=gcx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,lighten('#8b7355',30));grad.addColorStop(1,'#8b7355');
  gcx.fillStyle=grad;
  roundRect(gcx,x,y,w,h,rr);gcx.fill();
  gcx.strokeStyle=darken('#8b7355',40);gcx.lineWidth=Math.max(1,$(ts*0.025));
  roundRect(gcx,x,y,w,h,rr);gcx.stroke();
  gcx.fillStyle=SYM;
  gcx.font=`bold ${$(ts*0.34)}px sans-serif`;
  gcx.textAlign='center';gcx.textBaseline='middle';
  gcx.fillText('?',cx,$(cy+ts*0.01));
}

function drawEnemy(px,py,ts,color){
  const cx=$(px+ts/2),cy=$(py+ts/2);
  const margin=$(ts*0.20);
  const topY=$(py+margin),botY=$(py+ts-margin);
  const height=botY-topY;
  const halfW=$(height*0.577);
  const cr=Math.max(2,$(ts*0.045));
  const grad=gcx.createLinearGradient(cx,topY,cx,botY);
  grad.addColorStop(0,lighten(color,50));grad.addColorStop(1,color);
  gcx.fillStyle=grad;
  gcx.beginPath();gcx.moveTo(cx,topY);gcx.lineTo($(cx+halfW),botY);
  gcx.lineTo($(cx-halfW),botY);gcx.closePath();gcx.fill();
  gcx.lineJoin='round';gcx.lineWidth=cr*2;gcx.strokeStyle=color;
  gcx.beginPath();gcx.moveTo(cx,topY);gcx.lineTo($(cx+halfW),botY);
  gcx.lineTo($(cx-halfW),botY);gcx.closePath();gcx.stroke();
  gcx.lineWidth=Math.max(1,$(ts*0.025));gcx.strokeStyle=darken(color,40);
  gcx.beginPath();gcx.moveTo(cx,topY);gcx.lineTo($(cx+halfW),botY);
  gcx.lineTo($(cx-halfW),botY);gcx.closePath();gcx.stroke();
  gcx.lineJoin='miter';
  gcx.fillStyle=SYM;
  gcx.font=`bold ${$(ts*0.3)}px sans-serif`;
  gcx.textAlign='center';gcx.textBaseline='middle';
  gcx.fillText('!',cx,$(cy+ts*0.06));
}

const ASSET_PLACEMENTS = [
  { type: 'Player',  x: 2, y: 5, draw: drawPlayer },
  { type: 'Chest',   x: 4, y: 5, draw: drawChest },
  { type: 'Normal',  x: 6, y: 5, draw: (p,y,t)=>drawEnemy(p,y,t,EC.normal) },
  { type: 'Champion',x: 8, y: 5, draw: (p,y,t)=>drawEnemy(p,y,t,EC.champion) },
  { type: 'Elite',   x:10, y: 5, draw: (p,y,t)=>drawEnemy(p,y,t,EC.elite) },
  { type: 'Boss',    x:12, y: 5, draw: (p,y,t)=>drawEnemy(p,y,t,EC.boss) },
];

function drawAssets(){
  const ts=tileSize,ox=offsetX,oy=offsetY;
  for(const a of ASSET_PLACEMENTS){
    const px=ox+a.x*ts,py=oy+a.y*ts;
    gcx.fillStyle='rgba(255,255,255,0.04)';
    gcx.fillRect(px,py,ts,ts);
    a.draw(px,py,ts);
    gcx.fillStyle='rgba(255,255,255,0.5)';
    gcx.font=`bold ${Math.max(10,$(ts*0.15))}px monospace`;
    gcx.textAlign='center';
    gcx.fillText(a.type,$(px+ts/2),$(py+ts+Math.max(12,$(ts*0.2))));
  }
}

window.addEventListener('resize', () => { resize(); if (tiles) { drawRoom(tiles); drawAssets(); } });

let tiles;
resize();
tiles = generateRoomTiles();
drawRoom(tiles);
drawAssets();
</script>
</body>
</html>
