services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arche
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d arche -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  arche-service:
    build:
      context: .
      dockerfile: crates/arche-service/Dockerfile
    environment:
      ARCHE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/arche
      ARCHE_PORT: "8080"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - shared-seed:/shared-seed
    depends_on:
      postgres:
        condition: service_healthy

  admin-ui:
    build:
      context: admin-ui
      dockerfile: Dockerfile
      args:
        VITE_ARCHE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - arche-service

  seed:
    build:
      context: demos/dungeon-crawler/scripts
      dockerfile: Dockerfile
    entrypoint: ["npx", "tsx", "seed.ts"]
    environment:
      ARCHE_API_URL: http://arche-service:8080
      SUPER_ADMIN_KEY_FILE: /shared-seed/super-admin-key
      SEED_OUTPUT_FILE: /shared-seed/api-key
    volumes:
      - shared-seed:/shared-seed
    depends_on:
      arche-service:
        condition: service_started

  validate:
    build:
      context: demos/dungeon-crawler/scripts
      dockerfile: Dockerfile
    entrypoint: ["npx", "tsx", "validate.ts"]
    environment:
      ARCHE_API_URL: http://arche-service:8080
      ARCHE_API_KEY: ${ARCHE_API_KEY}
    depends_on:
      arche-service:
        condition: service_started

  dungeon-crawler:
    build:
      context: demos/dungeon-crawler
      dockerfile: Dockerfile
    ports:
      - "${DUNGEON_CRAWLER_PORT:-5173}:80"
    environment:
      ARCHE_API_URL: ${ARCHE_API_URL:-http://localhost:8080}
      ARCHE_API_KEY: ${ARCHE_API_KEY:-}
    volumes:
      - shared-seed:/shared-seed:ro
    depends_on:
      - arche-service

volumes:
  pgdata:
  shared-seed:
