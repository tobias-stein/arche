services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arche
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d arche -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  arche-service:
    build:
      context: .
      dockerfile: crates/arche-service/Dockerfile
    environment:
      ARCHE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/arche
      ARCHE_PORT: "8080"
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin-ui:
    build:
      context: admin-ui
      dockerfile: Dockerfile
      args:
        VITE_ARCHE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - arche-service

volumes:
  pgdata:
